<!doctype html>
<!-- Ladestopp · Copyright (c) 2026 Tekin Kaplan. Alle Rechte vorbehalten. -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1F4E9E">
<title>Ladestopp – Passwörter</title>
<link rel="icon" href="icon-180.png">
<style>
@font-face{font-family:"Barlow";font-weight:400;font-display:swap;src:url(vendor/fonts/barlow-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:600;font-display:swap;src:url(vendor/fonts/barlow-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Semi Condensed";font-weight:700;font-display:swap;src:url(vendor/fonts/barlow-semi-condensed-latin-700-normal.woff2) format("woff2")}
:root{--bg:#EEF1F5;--surface:#fff;--ink:#13233F;--muted:#5B6B85;--line:#D5DCE6;--sign:#1F4E9E;--amber:#F0B400;--amber-ink:#1B1600;--danger:#B3261E;--ok:#1B7F3B;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0E1729;--surface:#16223A;--ink:#E6ECF5;--muted:#93A3BD;--line:#2A3956;--sign:#2C5FB8;--danger:#FF8A80;--ok:#6FD08C;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Barlow",system-ui,sans-serif;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 32px)}
main{max-width:520px;margin:0 auto}
.plate{background:var(--sign);color:#fff;border-radius:10px;padding:12px 14px;border:2px solid #fff;box-shadow:0 0 0 2px var(--sign)}
.plate h1{margin:0;font:700 1.5rem "Barlow Semi Condensed",sans-serif}
.plate p{margin:2px 0 0;opacity:.85}
section{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:14px}
[hidden]{display:none!important}
h2{margin:0 0 8px;font:700 1.25rem "Barlow Semi Condensed",sans-serif}
label{display:block;color:var(--muted);font-size:.9rem;margin:10px 0 4px}
input{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
button,a.btn{display:block;width:100%;margin-top:12px;padding:15px;border:0;border-radius:10px;background:var(--sign);color:#fff;font:600 1.05rem "Barlow",sans-serif;text-align:center;text-decoration:none;cursor:pointer}
button:disabled{opacity:.5}
.sec{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.amber{background:var(--amber);color:var(--amber-ink)}
.msg{margin:10px 0 0;min-height:1.2em}.msg.err{color:var(--danger)}
.muted{color:var(--muted);font-size:.95rem}
.pw{font:700 1.7rem "Barlow Semi Condensed",sans-serif;text-align:center;background:var(--bg);border-radius:10px;padding:14px;margin:8px 0;user-select:all;word-break:break-all}
.done{border:2px solid var(--amber)}
.row{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding:10px 0}
.row:first-child{border-top:0}
.row div{flex:1;min-width:0}.row b{display:block}.row small{color:var(--muted)}
.row button{width:auto;margin:0;padding:9px 12px;font-size:.9rem;color:var(--danger)}
</style>
</head>
<body>
<main>
<div class="plate"><h1>Passwörter</h1><p>Ladestopp · nur für Tekin</p></div>

<section id="nochef" hidden>
  <h2>Bitte zuerst anmelden</h2>
  <p class="muted">Öffne die App und gib dort dein Chef-Passwort ein. Danach kommst du über ☰ Mehr › „Passwörter verwalten“ hierher.</p>
  <a class="btn" href="./">Zur App</a>
</section>

<section id="neu" hidden>
  <h2>Neues Passwort erstellen</h2>
  <label for="n">Name</label>
  <input id="n" placeholder="z. B. Max Mustermann" autocomplete="off">
  <label for="m">E-Mail</label>
  <input id="m" type="email" autocapitalize="off" spellcheck="false" placeholder="name@beispiel.de" autocomplete="off">
  <button id="go" class="amber">Passwort erstellen</button>
  <p class="msg" id="msg"></p>
</section>

<section id="fertig" class="done" hidden>
  <h2 id="fT">Passwort</h2>
  <div class="pw" id="pw"></div>
  <a class="btn amber" id="mailBtn" href="#">✉︎ Per E-Mail schicken</a>
  <button id="shareBtn" class="sec">Teilen (WhatsApp …)</button>
  <button id="copyBtn" class="sec">Kopieren</button>
</section>

<section id="liste" hidden>
  <h2>Wer hat ein Passwort <span class="muted" id="cnt"></span></h2>
  <div id="rows"></div>
  <p class="msg" id="lMsg"></p>
  <p class="muted" style="margin-top:10px"><a href="./" style="color:inherit">‹ Zur App</a></p>
</section>
</main>
<script>
(function(){
"use strict";
const API="https://tekin.tail62f658.ts.net/ladestopp/api/z/";
const $=id=>document.getElementById(id);
let acc=null;try{acc=JSON.parse(localStorage.getItem("ladestopp:acc"))}catch(e){}
function msg(id,t,err){const e=$(id);e.textContent=t||"";e.className="msg"+(err?" err":"")}
async function call(what,body){
  const r=await fetch(API+what,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token:acc.token,...body})});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Pi nicht erreichbar");return j;
}
const app=new URL("./",location.href).href;
let last=null;
async function liste(){
  try{
    const j=await call("liste",{});const rows=$("rows");rows.innerHTML="";
    $("cnt").textContent=j.nutzer.length?`(${j.nutzer.length})`:"";
    if(!j.nutzer.length){rows.innerHTML='<p class="muted">Noch niemand.</p>';return}
    for(const u of j.nutzer.slice().reverse()){
      const r=document.createElement("div");r.className="row";
      const t=document.createElement("div");t.innerHTML="<b></b><small></small>";t.querySelector("b").textContent=u.name;t.querySelector("small").textContent=u.mail+" · seit "+u.seit;
      const b=document.createElement("button");b.className="sec";b.textContent="Löschen";
      b.onclick=async()=>{if(!confirm(u.name+" löschen? Das Passwort funktioniert dann nicht mehr."))return;try{await call("loeschen",{mail:u.mail});liste()}catch(e){msg("lMsg",e.message,1)}};
      r.append(t,b);rows.append(r);
    }
  }catch(e){msg("lMsg",e.message,1)}
}
$("go").onclick=async()=>{
  const name=$("n").value.trim(),mail=$("m").value.trim().toLowerCase();
  if(!name){$("n").focus();return msg("msg","Bitte einen Namen eintragen.",1)}
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)){$("m").focus();return msg("msg","Bitte eine gültige E-Mail eintragen.",1)}
  $("go").disabled=true;msg("msg","");
  try{
    const j=await call("neu",{name,mail});
    const first=name.split(/\s+/)[0];
    const text=`Hallo ${first},\n\nhier ist dein Passwort für Ladestopp:\n\n${j.pw}\n\nSo geht's: Öffne ${app} in Safari oder Chrome, gib das Passwort ein, fertig.\nTipp: Über Teilen › „Zum Home-Bildschirm“ legst du die App als Icon ab.\n\nViele Grüße\nTekin`;
    last=text;
    $("fT").textContent="Passwort für "+name;$("pw").textContent=j.pw;
    $("mailBtn").href=`mailto:${mail}?subject=${encodeURIComponent("Dein Passwort für Ladestopp")}&body=${encodeURIComponent(text)}`;
    $("shareBtn").hidden=!navigator.share;
    $("fertig").hidden=false;$("fertig").scrollIntoView({behavior:"smooth"});
    $("n").value="";$("m").value="";liste();
  }catch(e){msg("msg",e.message,1)}
  finally{$("go").disabled=false}
};
$("shareBtn").onclick=()=>last&&navigator.share({title:"Dein Passwort für Ladestopp",text:last}).catch(()=>{});
$("copyBtn").onclick=async()=>{try{await navigator.clipboard.writeText($("pw").textContent);$("copyBtn").textContent="Kopiert ✓"}catch(e){}};
if(!acc||!acc.chef){$("nochef").hidden=false}
else{$("neu").hidden=false;$("liste").hidden=false;liste();}
})();
</script>
</body>
</html>
